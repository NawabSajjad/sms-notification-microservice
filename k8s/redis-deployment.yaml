apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          # resources:
          #   requests:   minimum resources guaranteed
          #     memory: "128mi" 
          #     cpu: "100m"
          #   limits:     maximum allowed usage
          #     memory: "256mi"
          #     cpu: "250m"
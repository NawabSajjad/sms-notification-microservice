apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
      - name: notification-worker
        image: smsworker:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: sms-api-config
        - secretRef:
            name: sms-api-secret
        env:
          - name: WORKER_TYPE
            value: "Notification"
          - name: RabbitMq__Host
            value: rabbitmq-client
          - name: RabbitMq__Port
            value: "5672"
          - name: RabbitMq__Username
            value: smsuser
          - name: RabbitMq__Password
            value: smspassword